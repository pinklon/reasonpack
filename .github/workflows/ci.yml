name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  reference-kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: bash -n bin/reasonpack install/*.sh tests/test-package.sh
      - name: Offline self-test
        run: ./bin/reasonpack self-test
      - name: Verify synthetic pack
        run: ./bin/reasonpack verify examples/sample-reasonpack
      - name: Reference-kit package tests
        run: ./tests/test-package.sh
      - name: Reader Edition and mail admission security tests
        run: |
          python3 tests/test-reader-edition.py
          python3 tests/test-mail-gateway-adapter.py
          python3 tests/test-reader-pipeline.py
          python3 tests/test-research-composition.py
          python3 tests/test-import-verified-mac-pack.py
          python3 tests/test-public-source-capture.py
          python3 tests/test-longform-segments.py
          python3 tests/test-mission-receipt.py
          python3 tests/test-longform-synthesis.py
          python3 tests/test-acquisition-supervisor.py
          python3 tests/test-acquisition-real-worker.py
          python3 tests/test-streaming-integrity.py
          python3 tests/test-acquisition-cgroup-contract.py
          python3 tests/test-release-preflight.py
          python3 tests/test-acquisition-signed-grant.py
          python3 tests/test-acquisition-sealed-admission.py
          python3 tests/test-owner-launch-claims.py
