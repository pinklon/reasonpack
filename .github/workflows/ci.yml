name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  reference-kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: bash -n bin/reasonpack install/*.sh tests/test-package.sh
      - name: Offline self-test
        run: ./bin/reasonpack self-test
      - name: Verify synthetic pack
        run: ./bin/reasonpack verify examples/sample-reasonpack
      - name: Reference-kit package tests
        run: ./tests/test-package.sh
      - name: Reader Edition and mail admission security tests
        run: |
          python3 tests/test-reader-edition.py
          python3 tests/test-mail-gateway-adapter.py
          python3 tests/test-reader-pipeline.py
