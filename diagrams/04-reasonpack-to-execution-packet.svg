<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#081526"/><stop offset="1" stop-color="#153a61"/></linearGradient><style>.t{font-family:Arial,sans-serif;fill:#fff}.h{font-size:58px;font-weight:700}.s{font-size:25px;fill:#b9c7d8}.b{font-size:24px}.k{font-size:16px;letter-spacing:3px;fill:#6bd4ff}.box{fill:#102943;stroke:#2d638c;stroke-width:2}.a{stroke:#5fd4ff;stroke-width:5;fill:none}.sm{font-size:18px;fill:#c8d4df}</style></defs><rect width="1600" height="900" fill="url(#g)"/><text x="90" y="90" class="t k">REASONPACK · REFERENCE KIT</text><text x="90" y="165" class="t h">From Context to Governed Work</text><text x="90" y="210" class="t s">ReasonPack is useful alone. Execution Packet is an optional downstream contract.</text><rect x="100" y="330" width="280" height="230" rx="22" class="box"/><text x="128" y="378" class="t b" font-weight="700">YouTube Source</text><text x="128" y="416" class="t sm">authorized input</text><text x="128" y="445" class="t sm">source identity</text><rect x="480" y="330" width="280" height="230" rx="22" class="box"/><text x="508" y="378" class="t b" font-weight="700">ReasonPack</text><text x="508" y="416" class="t sm">durable context</text><text x="508" y="445" class="t sm">verified members</text><rect x="860" y="330" width="280" height="230" rx="22" class="box"/><text x="888" y="378" class="t b" font-weight="700">Execution Packet</text><text x="888" y="416" class="t sm">optional</text><text x="888" y="445" class="t sm">governed work</text><rect x="1240" y="330" width="280" height="230" rx="22" class="box"/><text x="1268" y="378" class="t b" font-weight="700">Executor + Receipt</text><text x="1268" y="416" class="t sm">Codex / Claude / etc.</text><text x="1268" y="445" class="t sm">evidence of outcome</text><path d="M380 445 H480" class="a"/><path d="M470 430 L490 445 L470 460" class="a"/><path d="M760 445 H860" class="a"/><path d="M850 4