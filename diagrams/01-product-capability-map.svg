<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#081526"/><stop offset="1" stop-color="#153a61"/></linearGradient><style>.t{font-family:Arial,sans-serif;fill:#fff}.h{font-size:58px;font-weight:700}.s{font-size:25px;fill:#b9c7d8}.b{font-size:24px}.k{font-size:16px;letter-spacing:3px;fill:#6bd4ff}.box{fill:#102943;stroke:#2d638c;stroke-width:2}.a{stroke:#5fd4ff;stroke-width:5;fill:none}.sm{font-size:18px;fill:#c8d4df}</style></defs><rect width="1600" height="900" fill="url(#g)"/><text x="90" y="90" class="t k">REASONPACK · REFERENCE KIT</text><text x="90" y="165" class="t h">Product Capability Map</text><text x="90" y="210" class="t s">What the utility does today, without aspirational garnish.</text><rect x="80" y="330" width="240" height="220" rx="22" class="box"/><text x="108" y="378" class="t b" font-weight="700">1. Source</text><text x="108" y="416" class="t sm">YouTube URL</text><text x="108" y="445" class="t sm">allowlisted host</text><rect x="385" y="330" width="240" height="220" rx="22" class="box"/><text x="413" y="378" class="t b" font-weight="700">2. Acquire</text><text x="413" y="416" class="t sm">yt-dlp metadata</text><text x="413" y="445" class="t sm">media + captions</text><rect x="690" y="330" width="240" height="220" rx="22" class="box"/><text x="718" y="378" class="t b" font-weight="700">3. Normalize</text><text x="718" y="416" class="t sm">ffmpeg video/audio</text><text x="718" y="445" class="t sm">ffprobe metadata</text><rect x="995" y="330" width="240" height="220" rx="22" class="box"/><text x="1023" y="378" class="t b" font-weight="700">4. Transcript</text><text x="1023" y="416" class="t sm">captions first</text><text x="1023" y="445" class="t sm">local Whisper optional</text><rect x="1300" y="330" width="240" height="220" rx="22" class="box"/><text x="1328" y="378" class="t b" font-weight="700">5. Verify</text><text x="1328" y="416" class="t sm">manifest + SHA-256</text><text x="1328" y="445" class="t sm">closed-pack check</text><path d="M320 440 H380" class="a"/><path d="M370 425 L390 440 L370 455" class="a"/><path d="M625 440 H685" class="a"/><path d="M675 425 L695 440 L675 455" class="a"/><path d="M930 440 H990" class="a"/><path d="M980 425 L1000 440 L980 455" class="a"/><path d="M1235 440 H1295" class="a"/><path d="M1285 425 L1305 440 L1285 455" class="a"/><text x="90" y="850" class="t k">SOURCE → CONTEXT → VERIFICATION → REUSE</text></svg>